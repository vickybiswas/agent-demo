version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3004:3004"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevent node_modules from being overwritten
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8004
    networks:
      - app-network
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8004:8004"
    volumes:
      - ./backend:/app
    environment:
      - CORS_ORIGINS=http://localhost:3004,http://frontend:3004
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
