services:
  frontend:
    build: ./frontend
    container_name: calculator-frontend
    ports:
      - "3004:3004"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8004
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - calculator-network

  backend:
    build: ./backend
    container_name: calculator-backend
    ports:
      - "8004:8004"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - calculator-network

networks:
  calculator-network:
    driver: bridge
